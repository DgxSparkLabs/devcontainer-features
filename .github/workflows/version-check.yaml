name: "Check version bumps"
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Fetch base branch"
        run: git fetch origin "${{ github.base_ref }}"

      - name: "Require a version bump for every changed feature"
        run: python3 .github/scripts/version-checker.py --base-branch "${{ github.base_ref }}"
