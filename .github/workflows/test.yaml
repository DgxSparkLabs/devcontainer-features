name: "Test Features"
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      test_all:
        description: "Test every feature (not only changed ones)"
        type: boolean
        default: true
  schedule:
    # Nightly full run catches upstream drift (release-API changes, moved
    # download URLs, rate limits) even when nothing in the repo changed.
    - cron: "0 6 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      all: ${{ steps.features.outputs.all }}
      changed: ${{ steps.features.outputs.changed }}
      ci: ${{ steps.features.outputs.ci_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          list-files: json
          filters: |
            src:
              - 'src/**'
            test:
              - 'test/**'
            ci:
              - '.github/**'

      - id: features
        name: "Resolve feature lists"
        env:
          SRC_FILES: ${{ steps.filter.outputs.src_files }}
          TEST_FILES: ${{ steps.filter.outputs.test_files }}
          CI_CHANGED: ${{ steps.filter.outputs.ci }}
        run: |
          all=$(ls -1 src | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')
          printf '%s' "$SRC_FILES" > src_files.json
          printf '%s' "$TEST_FILES" > test_files.json
          changed=$(jq -c -s 'add | map(split("/")[1]) | unique | map(select(length > 0))' \
            src_files.json test_files.json)
          echo "all=$all" >> "$GITHUB_OUTPUT"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "ci_changed=$CI_CHANGED" >> "$GITHUB_OUTPUT"
          echo "all:     $all"
          echo "changed: $changed  (ci=$CI_CHANGED)"

  prepare:
    needs: changes
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.pick.outputs.target }}
      bins: ${{ steps.shard_auto.outputs.bins }}
      has_auto: ${{ steps.shard_auto.outputs.has }}
      scenario_bins: ${{ steps.shard_scenarios.outputs.bins }}
      has_scenarios: ${{ steps.shard_scenarios.outputs.has }}
    steps:
      - uses: actions/checkout@v4

      - id: pick
        name: "Select target features"
        env:
          EVENT: ${{ github.event_name }}
          TEST_ALL: ${{ github.event.inputs.test_all }}
          ALL: ${{ needs.changes.outputs.all }}
          CHANGED: ${{ needs.changes.outputs.changed }}
          CI_CHANGED: ${{ needs.changes.outputs.ci }}
        run: |
          if [ "$CI_CHANGED" = "true" ]; then
            target="$ALL"
          elif [ "$EVENT" = "pull_request" ]; then
            target="$CHANGED"
          elif [ "$EVENT" = "workflow_dispatch" ] && [ "$TEST_ALL" = "false" ]; then
            target="$CHANGED"
          else
            target="$ALL"
          fi
          scenarios=$(echo "$target" | jq -r '.[]' | while read -r d; do
            [ -f "test/$d/scenarios.json" ] && echo "$d"
          done | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "scenarios=$scenarios" >> "$GITHUB_OUTPUT"
          echo "target:    $target"
          echo "scenarios: $scenarios"

      - id: shard_auto
        name: "Shard autogenerated matrix"
        env:
          MAX_BINS: "80" # bins x 3 base images must stay under GitHub's 256 cap
          TARGET: ${{ steps.pick.outputs.target }}
        run: |
          bins=$(python3 .github/scripts/shard.py "$TARGET")
          echo "bins=$bins" >> "$GITHUB_OUTPUT"
          if [ "$bins" = "[]" ]; then echo "has=false"; else echo "has=true"; fi >> "$GITHUB_OUTPUT"

      - id: shard_scenarios
        name: "Shard scenario matrix"
        env:
          MAX_BINS: "256"
          SCENARIOS: ${{ steps.pick.outputs.scenarios }}
        run: |
          bins=$(python3 .github/scripts/shard.py "$SCENARIOS")
          echo "bins=$bins" >> "$GITHUB_OUTPUT"
          if [ "$bins" = "[]" ]; then echo "has=false"; else echo "has=true"; fi >> "$GITHUB_OUTPUT"

  test-autogenerated:
    needs: prepare
    if: needs.prepare.outputs.has_auto == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bin: ${{ fromJSON(needs.prepare.outputs.bins) }}
        baseImage:
          - debian:latest
          - ubuntu:latest
          - mcr.microsoft.com/devcontainers/base:ubuntu
    steps:
      - uses: actions/checkout@v4

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Autogenerated tests for '${{ matrix.bin }}' on '${{ matrix.baseImage }}'"
        run: devcontainer features test --skip-scenarios -f "${{ matrix.bin }}" -i "${{ matrix.baseImage }}" .

  test-scenarios:
    needs: prepare
    if: needs.prepare.outputs.has_scenarios == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bin: ${{ fromJSON(needs.prepare.outputs.scenario_bins) }}
    steps:
      - uses: actions/checkout@v4

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Scenario tests for '${{ matrix.bin }}'"
        run: devcontainer features test -f "${{ matrix.bin }}" --skip-autogenerated --skip-duplicated .

  test-global:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Testing global scenarios"
        run: devcontainer features test --global-scenarios-only .

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Install shellcheck"
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: "Lint feature and test shell scripts"
        run: shellcheck --severity=error -e SC2148 src/*/*.sh test/*/*.sh

  ci-status:
    # Single required-check aggregate. Individual test jobs keep their real
    # result (no continue-on-error masking), so any 'failure' here is genuine.
    needs:
      - changes
      - prepare
      - test-autogenerated
      - test-scenarios
      - test-global
      - shellcheck
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: "Aggregate job results"
        run: |
          echo "changes:          ${{ needs.changes.result }}"
          echo "prepare:          ${{ needs.prepare.result }}"
          echo "test-autogenerated: ${{ needs.test-autogenerated.result }}"
          echo "test-scenarios:   ${{ needs.test-scenarios.result }}"
          echo "test-global:      ${{ needs.test-global.result }}"
          echo "shellcheck:       ${{ needs.shellcheck.result }}"
          if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}; then
            echo "::error::One or more required jobs failed."
            exit 1
          fi
          echo "All required jobs passed."
